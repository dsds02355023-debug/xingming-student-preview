name: Student obfuscated preview APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout public preview workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout private original source
        uses: actions/checkout@v4
        with:
          repository: dsds02355023-debug/xingming-android-apps
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract source and apply isolated preview package
        run: |
          unzip -q private-source/source-student-layout-backfix.zip -d smoke-source
          cp private-source/.github/scripts/patch-student.py .github/scripts/patch-student.py
          cp private-source/.github/scripts/student-smoke.sh .github/scripts/student-smoke.sh
          cp private-source/.github/scripts/student-back.py .github/scripts/student-back.py
          python3 .github/scripts/patch-student.py
      - name: Obfuscate inline JavaScript
        run: python3 .github/scripts/obfuscate-inline-js.py
      - name: Build and verify preview APK
        run: |
          gradle -p smoke-source --no-daemon --console=plain assembleStudentDebug
          apk=smoke-source/app/build/outputs/apk/student/debug/app-student-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > preview-badging.txt
          grep -F "package: name='com.xingming.apps.student.preview'" preview-badging.txt
          cp "$apk" xingming-student-preview.apk
      - name: Prepare emulator smoke test
        run: |
          sed -i 's/com\\.xingming\\.apps\\.student/com.xingming.apps.student.preview/g' .github/scripts/student-smoke.sh .github/scripts/student-back.py
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash -e .github/scripts/student-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xingming-student-preview-obfuscated
          path: xingming-student-preview.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-preview-diagnostics
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7
