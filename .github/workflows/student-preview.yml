name: Student side-by-side preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Patch and build preview
        run: |
          unzip -q source-student-layout-backfix.zip -d smoke-source
          python3 .github/scripts/patch-student.py
          gradle -p smoke-source --no-daemon assembleStudentDebug
          apk=smoke-source/app/build/outputs/apk/student/debug/app-student-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > preview-badging.txt
          grep -F "package: name='com.xingming.apps.student.preview'" preview-badging.txt
          sed -i 's/com\\.xingming\\.apps\\.student/com.xingming.apps.student.preview/g' .github/scripts/student-smoke.sh .github/scripts/student-back.py
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash -e .github/scripts/student-smoke.sh
      - run: cp smoke-source/app/build/outputs/apk/student/debug/app-student-debug.apk xingming-student-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xingming-student-preview
          path: xingming-student-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-preview-diagnostics
          path: smoke-results/
          if-no-files-found: ignore
